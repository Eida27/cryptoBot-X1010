[project]
name = "crypto-futures-bot"
version = "0.1.0"
description = "Private, bounded Futures research and paper trading"
requires-python = ">=3.12,<3.13"
dependencies = [
  "binance-sdk-derivatives-trading-usds-futures==17.5.0",
  "fastapi==0.142.2", "uvicorn==0.54.0", "jinja2==3.1.6",
  "pydantic-settings==2.15.0", "argon2-cffi==25.1.0",
  "httpx==0.28.1", "python-multipart==0.0.32", "psutil==7.2.2",
]
[project.scripts]
cbot = "crypto_bot.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/crypto_bot"]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.168.3", "ruff==0.16.10", "mypy==2.4.0", "playwright==1.63.0", "types-psutil"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
